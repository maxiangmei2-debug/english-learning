body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#f3f4f6;color:#1f2937;padding:16px;max-width:860px;margin:0 auto;padding-bottom:80px}

.spk:hover{background:#7C3AED;color:#fff}
.spk:active{transform:scale(.9)}
.body{flex:1;line-height:1.95;font-size:16px;color:#1f2937}
/* 对话 */
.turn{display:flex;gap:10px;align-items:flex-start;padding:8px}
.bubblewrap{flex:1;display:flex;flex-direction:column;gap:4px}

.lnk{color:#059669;font-weight:800;font-size:15px;margin:0 1px;vertical-align:baseline;letter-spacing:-1px}

.strike{text-decoration:line-through;text-decoration-color:#db2777;text-decoration-thickness:2px;color:#9ca3af}

.hint b{color:#6d28d9}
.empty{color:#9ca3af;font-size:14px;text-align:center;padding:30px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 18px;border-radius:12px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:99999}
#toast.show{opacity:.95}
@media(max-width:560px){.topbar h1{font-size:18px}.body,.bubble{font-size:15px}.ratewrap{margin-left:0;width:100%}}

<div class="hint">
  💡 <b>怎么用：</b>点每段/每句话右侧的 🔊 喇叭，听一遍再跟着读（影子跟读）；点<b>任意单词</b>可单独听该词。<br>
  💡 <b>连读 ⌒</b>：前一词尾辅音 + 后一词首元音时自然连读（如 <i>put⌒it⌒on</i>）。<b>略读</b>：词尾塞音后接辅音时失去爆破（如 <i>wen<t>̶</t> to</i>）。<b>语调 ↗↘</b>：升调↗（一般疑问句）/ 降调↘（陈述句、特殊疑问句）。<br>
  💡 标注为<b>启发式提示</b>，仅供参考；语速调到 <b>0.6–0.8×</b> 更适合模仿跟读。

<script>
(function () {
  'use strict';
  var DATA = window.SHADOWING_DATA || [];
  var cur = null;
  var LSK = 'shadowing_last';
  var annotate = false;
  var curRate = 0.8;

  // ---------- 语音 ----------
  var synth = window.speechSynthesis || null;
  var voices = [];
  function loadVoices(){ try { voices = synth ? synth.getVoices() : []; } catch(e){ voices = []; } }
  if (synth) {
    if ('onvoiceschanged' in synth) synth.onvoiceschanged = loadVoices;
    loadVoices();
  }
  function pickVoice(){
    if (!voices.length) return null;
    return voices.find(function(v){return /en[-_]US/i.test(v.lang);})
        || voices.find(function(v){return /en[-_]GB/i.test(v.lang);})
        || voices.find(function(v){return /^en/i.test(v.lang);})
        || null;
  }
  var speaking = false;
  function speakSeq(parts){
    if (!synth) { toast('当前浏览器不支持语音朗读（建议用 Chrome / Edge）'); return; }
    synth.cancel();
    parts = parts.map(function(s){return s.trim();}).filter(Boolean);
    if (!parts.length) { speaking = false; return; }
    var i = 0;
    function next(){
      if (i >= parts.length) { speaking = false; return; }
      speaking = true;
      var u = new SpeechSynthesisUtterance(parts[i]);
      var v = pickVoice(); if (v) u.voice = v;
      u.lang = v ? v.lang : 'en-US';
      u.rate = curRate; u.pitch = 1;
      var done = false;
      function advance(){ if (done) return; done = true; clearTimeout(wd); i++; next(); }
      u.onend = advance;
      u.onerror = advance;
      synth.speak(u);
      // Chrome 长句可能不触发 onend，加看门狗兜底
      var wd = setTimeout(function(){ if (done) return; done = true; try { synth.cancel(); } catch(e){} i++; next(); }, 11000);
    }
    next();
  }
  function splitSentences(text){
    return text.match(/[^.!?]+[.!?]+|\S[^.!?]*$/g) || [text];
  }
  function speakUnit(text){ speakSeq(splitSentences(text)); }
  function speakAll(){
    var x = cur; if (!x) return;
    var parts = [];
    if (x.content.type === 'dialogue') x.content.turns.forEach(function(t){ if (t.text) parts.push(t.text); });
    else x.content.paragraphs.forEach(function(p){ if (p) parts.push(p); });
    speakSeq(splitSentences(parts.join(' ')));
  }

  // ---------- 标注 ----------
  function esc(s){ return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  var VOWELS = 'aeiouy';
  var CONS   = 'bcdfghjklmnpqrstvwxz';
  var AUX    = 'am is are was were be been being do does did have has had can could will would shall should may might must'.split(' ');
  var WH     = 'what which who whom whose where when why how'.split(' ');

  function isVowel(c){ return VOWELS.indexOf(c) >= 0; }
  function isCons(c){ return CONS.indexOf(c) >= 0; }
  function alphaTail(w){ var m = w.match(/[a-zA-Z]+$/); return m ? m[0].toLowerCase() : ''; }
  function alphaHead(w){ var m = w.match(/^[a-zA-Z]+/); return m ? m[0].toLowerCase() : ''; }

  // 连读/略读：以文档标注为准，不再自动推断
  function isLink(a, b){ return false; }  // 保留函数签名但禁用
  function isUnreleased(tk, nextTk){ return false; }  // 保留函数签名但禁用
  function sentenceTone(sentence){ return ''; }  // 禁用语调

  // 当前课的标注数据（从 shadowing_data.js 的 annotations 字段读取）
  var curAnnotations = null;

  // 检查两个词是否在标注的连读对中
  function isLinkByAnnotation(leftWord, rightWord) {
    if (!curAnnotations || !curAnnotations.linking) return false;
    var lw = leftWord.toLowerCase().replace(/[^a-z']/g, '');
    var rw = rightWord.toLowerCase().replace(/[^a-z']/g, '');
    for (var i = 0; i < curAnnotations.linking.length; i++) {
      var lk = curAnnotations.linking[i];
      var al = lk.left.toLowerCase().replace(/[^a-z']/g, '');
      var ar = lk.right.toLowerCase().replace(/[^a-z']/g, '');
      if (al === lw && ar === rw) return true;
    }
    return false;
  }

  // 检查词是否在标注的略读列表中
  function isElisionByAnnotation(word) {
    if (!curAnnotations || !curAnnotations.elision) return null;
    var w = word.toLowerCase().replace(/[^a-z']/g, '');
    for (var i = 0; i < curAnnotations.elision.length; i++) {
      var el = curAnnotations.elision[i];
      var aw = el.word.toLowerCase().replace(/[^a-z']/g, '');
      if (aw === w) return el.char;
    }
    return null;
  }

  function renderUnit(text){
    var toks = text.match(/[\w’']+|[^\w\s]+|\s+/g) || [text];
    var info = [];
    var prevWordIdx = -1;
    for (var i=0;i<toks.length;i++){
      var tk = toks[i];
      var inf = {tk:tk, isWord:false, clean:'', linkWithPrev:false, elisionChar:null, nextWordTk:''};
      if (/^[\w’']+$/.test(tk)) {
        inf.isWord = true;
        inf.clean = tk.toLowerCase().replace(/[^a-z’']/g,'').replace(/’/g, "'");
        // 使用标注数据判断连读
        if (annotate && prevWordIdx >= 0 && isLinkByAnnotation(toks[prevWordIdx], tk)) {
          inf.linkWithPrev = true;
        }
        for (var j=i+1;j<toks.length;j++){
          if (/^[\w’']+$/.test(toks[j])) { inf.nextWordTk = toks[j]; break; }
        }
        // 使用标注数据判断略读
        if (annotate) {
          var elChar = isElisionByAnnotation(tk);
          if (elChar) inf.elisionChar = elChar;
        }
        prevWordIdx = i;
        info.push(inf);
      } else {
        if (/[.!?]/.test(tk)) prevWordIdx = -1;
        info.push(inf);
      }
    }
    var out = '';
    for (var i=0;i<info.length;i++){
      var inf = info[i];
      var tk = inf.tk;
      if (/^\s+$/.test(tk)) { out += tk; continue; }
      if (!inf.isWord) {
        out += esc(tk);
        continue;
      }
      // 连读弧线：在连读词之间插入 ⌒
      if (annotate && inf.linkWithPrev) {
        out += '<span class="lnk" title="连读 Linking">⌒</span>';
      }
      out += renderWord(tk, inf.clean, inf.elisionChar);
    }
    return out;
  }

  function renderWord(tk, clean, elisionChar){
    var html = esc(tk);
    if (!annotate || !elisionChar) return '<span class="w" data-w="' + esc(clean) + '">' + html + '</span>';
    var s = tk.replace(/[’]/g, "'");
    // 根据标注数据标记略读字符
    var elLower = elisionChar.toLowerCase();
    var sLower = s.toLowerCase();
    var idx = sLower.lastIndexOf(elLower);
    if (idx >= 0) {
      html = esc(s.slice(0, idx)) + '<span class="strike">' + esc(s.slice(idx, idx + elisionChar.length)) + '</span>' + esc(s.slice(idx + elisionChar.length));
      return '<span class="w" data-w="' + esc(clean) + '">' + html + '<sup class="elide-mark">略</sup></span>';
    }
    // fallback: 标记最后一个字符
    var last = s.slice(-1);
    var rest = s.slice(0, -1);
    html = esc(rest) + '<span class="strike">' + esc(last) + '</span>';
    return '<span class="w" data-w="' + esc(clean) + '">' + html + '<sup class="elide-mark">略</sup></span>';
  }

  // ---------- 渲染课文 ----------
  var $ = function(id){ return document.getElementById(id); };
  var showTranslation = false;
  function getTranslation(x, idx){
    var arr = x.translations || [];
    return (arr[idx] || '').trim();
  }
  function makeTranslation(text){
    var div = document.createElement('div');
    div.className = 'translation' + (text ? '' : ' empty');
    if (showTranslation) div.classList.add('show');
    div.textContent = text || '（暂无翻译）';
    return div;
  }
  function renderLesson(x){
    curAnnotations = x.annotations || null;
    cur = x;
    $('lessonTitle').textContent = '📄 ' + x.mc + ' · ' + x.title;
    var isDialogue = x.content.type === 'dialogue';
    var n = isDialogue ? x.content.turns.length : x.content.paragraphs.length;
    $('lessonMeta').textContent = (isDialogue ? '对话 · ' : '短文 · ') + n + ' 段' + (isDialogue ? '（说话人）' : '（段落）');
    var box = $('content');
    box.innerHTML = '';
    if (isDialogue) {
      x.content.turns.forEach(function(t, idx){
        if (t.speaker == null) {
          var dv = document.createElement('div');
          dv.className = 'divider';
          dv.textContent = t.text || '—';
          box.appendChild(dv);
          return;
        }
        var row = document.createElement('div');
        row.className = 'turn';
        var spk = document.createElement('button');
        spk.className = 'spk'; spk.type = 'button'; spk.textContent = '🔊';
        spk.setAttribute('data-text', t.text);
        var wrap = document.createElement('div');
        wrap.className = 'bubblewrap';
        var name = document.createElement('span');
        name.className = 'speaker' + (idx % 2 ? ' alt' : '');
        name.textContent = t.speaker;
        var bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.innerHTML = renderUnit(t.text);
        wrap.appendChild(name); wrap.appendChild(bubble);
        wrap.appendChild(makeTranslation(getTranslation(x, idx)));
        row.appendChild(spk); row.appendChild(wrap);
        box.appendChild(row);
      });
    } else {
      x.content.paragraphs.forEach(function(p, idx){
        var row = document.createElement('div');
        row.className = 'unit';
        var spk = document.createElement('button');
        spk.className = 'spk'; spk.type = 'button'; spk.textContent = '🔊';
        spk.setAttribute('data-text', p);
        var body = document.createElement('div');
        body.className = 'body';
        body.innerHTML = renderUnit(p);
        body.appendChild(makeTranslation(getTranslation(x, idx)));
        row.appendChild(spk); row.appendChild(body);
        box.appendChild(row);
      });
    }
    // 图例
    if (annotate && curAnnotations && curAnnotations.linking && curAnnotations.elision && (curAnnotations.linking.length || curAnnotations.elision.length)) {
      var legend = document.createElement('div');
      legend.className = 'legend';
      legend.innerHTML = '<span><i class="lnk">⌒</i> 连读 Linking</span><span><i class="strk">t</i><sup class="elide-mark">略</sup> 略读 Unreleased</span>';
      box.appendChild(legend);
    }
  }

  function selectLesson(mc, persist){
    var x = DATA.find(function(d){ return d.mc === mc; });
    if (!x) return;
    renderLesson(x);
    if (persist !== false) { try { localStorage.setItem(LSK, mc); } catch(e){} }
  }

  // ---------- 初始化 ----------
  (function init(){
    var sel = $('lesson');
    DATA.forEach(function(x){
      var o = document.createElement('option');
      o.value = x.mc;
      o.textContent = x.mc + ' · ' + x.title;
      sel.appendChild(o);
    });
    if (!DATA.length) { $('content').innerHTML = '<div class="empty">短文数据未加载，请确认 shadowing_data.js 存在</div>'; return; }
    var last = null;
    try { last = localStorage.getItem(LSK); } catch(e){}
    if (last && DATA.some(function(d){ return d.mc === last; })) sel.value = last;
    else sel.value = DATA[0].mc;
    selectLesson(sel.value, false);
  })();

  // ---------- 事件 ----------
  $('lesson').addEventListener('change', function(){ selectLesson(this.value); });
  $('btnRandom').addEventListener('click', function(){
    if (!DATA.length) return;
    var mc = DATA[Math.floor(Math.random()*DATA.length)].mc;
    $('lesson').value = mc; selectLesson(mc); toast('已随机：' + mc);
  });
  $('btnReadAll').addEventListener('click', function(){ speakAll(); });
  $('btnStop').addEventListener('click', function(){ if (synth) synth.cancel(); speaking = false; });
  $('annChk').addEventListener('change', function(){ annotate = this.checked; if (cur) renderLesson(cur); });
  $('btnTrans').addEventListener('click', function(){
    showTranslation = !showTranslation;
    this.textContent = showTranslation ? '🌐 隐藏翻译' : '🌐 显示翻译';
    this.className = showTranslation ? 'btn btn-purple' : 'btn btn-line';
    document.querySelectorAll('.translation').forEach(function(el){
      el.classList.toggle('show', showTranslation);
    });
  });
  $('rate').addEventListener('input', function(){ curRate = parseFloat(this.value); $('rateVal').textContent = curRate.toFixed(2).replace(/0$/,'') + '×'; });

  // 喇叭 / 单词点击（事件委托）
  $('content').addEventListener('click', function(e){
    var spk = e.target.closest('.spk');
    if (spk) { speakUnit(spk.getAttribute('data-text')); return; }
    var w = e.target.closest('.w');
    if (w) {
      var word = w.getAttribute('data-w');
      if (word) speakSeq([word]);
    }
  });

  function toast(msg){
    var t = $('toast'); t.textContent = msg; t.classList.add('show');
    setTimeout(function(){ t.classList.remove('show'); }, 1800);
  }
})();
</script>
