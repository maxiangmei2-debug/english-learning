<title>影子跟读 · 英语学习</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#f3f4f6;color:#1f2937;padding:16px;max-width:860px;margin:0 auto;padding-bottom:80px}
a.back{display:inline-block;text-decoration:none;color:#4f46e5;font-size:13px;font-weight:600;margin-bottom:12px}
.topbar{background:linear-gradient(135deg,#7C3AED,#A855F7);color:#fff;border-radius:18px;padding:18px;margin-bottom:16px}
.topbar h1{font-size:21px;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.topbar p{font-size:12px;opacity:.88}
.lessonrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
.lessonrow label{font-size:14px;font-weight:600;white-space:nowrap}
#lesson{font-size:15px;padding:9px 12px;border:1px solid #ddd6fe;border-radius:12px;background:#fff;color:#1f2937;flex:1;min-width:200px}
#lesson:focus{outline:none;border-color:#7C3AED;box-shadow:0 0 0 3px #ede9fe}
.btn{font-family:inherit;cursor:pointer;border:none;border-radius:12px;font-size:13px;font-weight:700;padding:9px 14px;transition:.15s;white-space:nowrap}
.btn-ghost{background:#ede9fe;color:#6d28d9}
.btn-ghost:hover{background:#ddd6fe}
.btn-line{background:#fff;color:#6b7280;border:1px solid #d1d5db}
.btn-line:hover{background:#f9fafb}
.btn-purple{background:#7C3AED;color:#fff}
.btn-purple:hover{background:#6d28d9}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px;background:#fff;border-radius:16px;padding:12px 14px;box-shadow:0 4px 16px rgba(0,0,0,.05)}
.toggle{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;cursor:pointer;user-select:none}
.toggle input{width:18px;height:18px;accent-color:#7C3AED;cursor:pointer}
.ratewrap{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;margin-left:auto}
.ratewrap input[type=range]{width:130px;accent-color:#7C3AED}
#rateVal{min-width:38px;text-align:center;color:#7C3AED;font-variant-numeric:tabular-nums}
.card{background:#fff;border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 4px 16px rgba(0,0,0,.05)}
.card h2{font-size:15px;margin-bottom:10px;display:flex;align-items:center;gap:8px;color:#6d28d9}
.meta{font-size:12px;color:#9ca3af;font-weight:600}
.unit{display:flex;gap:10px;align-items:flex-start;padding:10px 8px;border-radius:12px;transition:background .15s}
.unit:hover{background:#faf5ff}
.spk{flex:0 0 auto;background:#f3e8ff;color:#7C3AED;border:none;border-radius:50%;width:34px;height:34px;font-size:15px;cursor:pointer;margin-top:2px;transition:.15s}
.spk:hover{background:#7C3AED;color:#fff}
.spk:active{transform:scale(.9)}
.body{flex:1;line-height:1.95;font-size:16px;color:#1f2937}
/* 对话 */
.turn{display:flex;gap:10px;align-items:flex-start;padding:8px}
.bubblewrap{flex:1;display:flex;flex-direction:column;gap:4px}
.speaker{display:inline-block;font-size:12px;font-weight:700;color:#fff;background:#A855F7;padding:2px 10px;border-radius:999px;align-self:flex-start}
.speaker.alt{background:#6366F1}
.bubble{background:#f5f3ff;border:1px solid #ede9fe;border-radius:14px;padding:10px 14px;line-height:1.95;font-size:16px}
.divider{text-align:center;color:#9ca3af;font-size:12px;font-weight:700;letter-spacing:1px;margin:10px 0;padding:6px;background:#f9fafb;border-radius:10px}
/* 翻译 */
.translation{display:none;font-size:14px;color:#4b5563;background:#f0fdfa;border-left:3px solid #14b8a6;padding:9px 12px;border-radius:8px;margin-top:6px;line-height:1.75}
.translation.show{display:block}
.translation.empty{color:#9ca3af;background:#f9fafb;border-left-color:#d1d5db}
/* 单词 / 标注 */
.w{cursor:pointer;border-radius:4px;padding:0 1px;transition:background .12s;position:relative;display:inline-block}
.w:hover{background:#fde68a}
/* 连读：两个词之间的弧线 */
.link-pair{position:relative;display:inline-block;white-space:nowrap}
.link-pair::after{content:'';position:absolute;left:0;right:0;top:-8px;height:10px;border-top:2px solid #10B981;border-radius:50% 50% 0 0;pointer-events:none;opacity:.85}
.link-pair .w{padding:0 2px}
/* 略读：删除线 */
.strike{text-decoration:line-through;text-decoration-color:#db2777;text-decoration-thickness:2px;color:#9ca3af}
/* 语调箭头 */
.tone{position:relative;display:inline-block;padding-right:14px}
.tone::after{position:absolute;right:-2px;top:-10px;font-size:14px;font-weight:800}
.tone.fall::after{content:'↘';color:#3b82f6}
.tone.rise::after{content:'↗';color:#f59e0b}
.tone.list::after{content:'↗';color:#a855f7}
/* 标注图例 */
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:#6b7280;margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend .arc{display:inline-block;width:22px;height:8px;border-top:2px solid #10B981;border-radius:50% 50% 0 0}
.legend .strk{text-decoration:line-through;text-decoration-color:#db2777;text-decoration-thickness:2px;color:#9ca3af}
.legend .arrow{font-size:14px;font-weight:800}
.hint{font-size:12px;color:#6b7280;background:#f9fafb;border-left:3px solid #ddd6fe;padding:11px 13px;border-radius:8px;margin-top:12px;line-height:1.8}
.hint b{color:#6d28d9}
.empty{color:#9ca3af;font-size:14px;text-align:center;padding:30px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 18px;border-radius:12px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:99999}
#toast.show{opacity:.95}
@media(max-width:560px){.topbar h1{font-size:18px}.body,.bubble{font-size:15px}.ratewrap{margin-left:0;width:100%}}
</style>

<body>

<a href="index.html?v=20260731-0947" class="back">← 返回英语学习中心</a>

<div class="topbar">
  <h1>🎙️ 影子跟读</h1>
  <p>B2 精读短文 · 逐句跟读 · 连读/略读标注 · 手机电脑都能用</p>
  <div class="lessonrow">
    <label for="lesson">课文：</label>
    <select id="lesson"></select>
    <button class="btn btn-ghost" id="btnRandom">🎲 随机一篇</button>
  </div>
</div>

<div class="toolbar">
  <button class="btn btn-purple" id="btnReadAll">🔊 朗读全文</button>
  <button class="btn btn-line" id="btnStop">⏹ 停止</button>
  <button class="btn btn-line" id="btnTrans">🌐 显示翻译</button>
  <label class="toggle"><input type="checkbox" id="annChk"> 🏷️ 连读/略读/语调</label>
  <div class="ratewrap">
    <span>语速</span>
    <input type="range" id="rate" min="0.5" max="1" step="0.05" value="0.8">
    <span id="rateVal">0.8×</span>
  </div>
</div>

<div class="card" id="contentCard">
  <h2 id="lessonTitle">📄 请选择课文</h2>
  <div class="meta" id="lessonMeta"></div>
  <div id="content"><div class="empty">从上方选择一篇课文开始跟读 ✨</div></div>
</div>

<div class="hint">
  💡 <b>怎么用：</b>点每段/每句话右侧的 🔊 喇叭，听一遍再跟着读（影子跟读）；点<b>任意单词</b>可单独听该词。<br>
  💡 <b>连读 ⌒</b>：前一词尾是辅音、后一词首是元音时自然连读（如 <i>put it on</i>）。<b>略 / 弱</b>：功能词弱读形式或缩略/弱化词（如 <i>I'm、gonna、the→/ðə/</i>）。<br>
  💡 标注为<b>启发式提示</b>，仅供参考；语速调到 <b>0.6–0.8×</b> 更适合模仿跟读。
</div>

<div id="toast"></div>

<div id="__ver_badge" style="position:fixed;right:6px;bottom:6px;z-index:99999;font-size:10px;color:#9ca3af;background:rgba(255,255,255,.7);padding:2px 6px;border-radius:6px;pointer-events:none;font-family:sans-serif;">v20260731-0947</div>

<script src="shadowing_data.js?v=20260731-0947"></script>
<script>
(function () {
  'use strict';
  var DATA = window.SHADOWING_DATA || [];
  var cur = null;
  var LSK = 'shadowing_last';
  var annotate = false;
  var curRate = 0.8;

  // ---------- 语音 ----------
  var synth = window.speechSynthesis || null;
  var voices = [];
  function loadVoices(){ try { voices = synth ? synth.getVoices() : []; } catch(e){ voices = []; } }
  if (synth) {
    if ('onvoiceschanged' in synth) synth.onvoiceschanged = loadVoices;
    loadVoices();
  }
  function pickVoice(){
    if (!voices.length) return null;
    return voices.find(function(v){return /en[-_]US/i.test(v.lang);})
        || voices.find(function(v){return /en[-_]GB/i.test(v.lang);})
        || voices.find(function(v){return /^en/i.test(v.lang);})
        || null;
  }
  var speaking = false;
  function speakSeq(parts){
    if (!synth) { toast('当前浏览器不支持语音朗读（建议用 Chrome / Edge）'); return; }
    synth.cancel();
    parts = parts.map(function(s){return s.trim();}).filter(Boolean);
    if (!parts.length) { speaking = false; return; }
    var i = 0;
    function next(){
      if (i >= parts.length) { speaking = false; return; }
      speaking = true;
      var u = new SpeechSynthesisUtterance(parts[i]);
      var v = pickVoice(); if (v) u.voice = v;
      u.lang = v ? v.lang : 'en-US';
      u.rate = curRate; u.pitch = 1;
      var done = false;
      function advance(){ if (done) return; done = true; clearTimeout(wd); i++; next(); }
      u.onend = advance;
      u.onerror = advance;
      synth.speak(u);
      // Chrome 长句可能不触发 onend，加看门狗兜底
      var wd = setTimeout(function(){ if (done) return; done = true; try { synth.cancel(); } catch(e){} i++; next(); }, 11000);
    }
    next();
  }
  function splitSentences(text){
    return text.match(/[^.!?]+[.!?]+|\S[^.!?]*$/g) || [text];
  }
  function speakUnit(text){ speakSeq(splitSentences(text)); }
  function speakAll(){
    var x = cur; if (!x) return;
    var parts = [];
    if (x.content.type === 'dialogue') x.content.turns.forEach(function(t){ if (t.text) parts.push(t.text); });
    else x.content.paragraphs.forEach(function(p){ if (p) parts.push(p); });
    speakSeq(splitSentences(parts.join(' ')));
  }

  // ---------- 标注 ----------
  function esc(s){ return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  var VOWELS = 'aeiouy';
  var CONS   = 'bcdfghjklmnpqrstvwxz';
  var AUX    = 'am is are was were be been being do does did have has had can could will would shall should may might must'.split(' ');
  var WH     = 'what which who whom whose where when why how'.split(' ');

  function isVowel(c){ return VOWELS.indexOf(c) >= 0; }
  function isCons(c){ return CONS.indexOf(c) >= 0; }
  function alphaTail(w){ var m = w.match(/[a-zA-Z]+$/); return m ? m[0].toLowerCase() : ''; }
  function alphaHead(w){ var m = w.match(/^[a-zA-Z]+/); return m ? m[0].toLowerCase() : ''; }

  // 连读：前词尾 + 后词首
  function isLink(a, b){
    var A = alphaTail(a), B = alphaHead(b);
    if (!A || !B) return false;
    var aLast = A.slice(-1), bFirst = B[0];
    if (isCons(aLast) && isVowel(bFirst)) return true;      // C+V
    if (isVowel(aLast) && isVowel(bFirst)) return true;      // V+V 滑音
    if (aLast === 'r' && isVowel(bFirst)) return true;       // R 连读
    return false;
  }

  // 略读：词尾塞音 /t,d,k,g,p,b/ 后接辅音（最常见 n+t 在 n't 中）
  function unstressedParts(tk){
    var s = tk.replace(/[\u2019]/g, "'");
    var parts = [];
    // n't 中的 t
    var m = s.match(/^(.*n)('t)$/i);
    if (m) { parts.push({pre:m[1], strike:m[2]}); return parts; }
    // 词尾塞音 + 后接辅音（在 render 时由上下文决定，这里只返回候选）
    if (/[tkdgpbd]$/i.test(s)) parts.push({pre:null, strike:s.slice(-1)});
    return parts;
  }

  function sentenceTone(sentence){
    sentence = sentence.trim();
    var last = sentence.slice(-1);
    if (last !== '?') return 'fall';
    var first = sentence.split(/\s+/)[0].toLowerCase().replace(/[^a-z]/g,'');
    if (AUX.indexOf(first) >= 0) return 'rise';
    if (WH.indexOf(first) >= 0) return 'fall';
    // 默认一般疑问句升调
    return 'rise';
  }

  function renderUnit(text){
    var toks = text.match(/[\w’']+|[^\w\s]+|\s+/g) || [text];
    // 第一遍：识别每个 token 属性
    var info = [];
    var prevWord = null;
    for (var i=0;i<toks.length;i++){
      var tk = toks[i];
      var inf = {tk:tk, isWord:false, clean:'', linkPrev:false, linkNext:false};
      if (/^[\w’']+$/.test(tk)) {
        inf.isWord = true;
        inf.clean = tk.toLowerCase().replace(/[^a-z’]/g,'').replace(/’/g,"'");
        if (annotate && prevWord && isLink(prevWord.tk, tk)) {
          inf.linkPrev = true;
          prevWord.linkNext = true;
        }
        prevWord = inf;
      } else if (/[.!?]/.test(tk)) {
        prevWord = null;
      }
      info.push(inf);
    }
    // 第二遍：渲染
    var out = '';
    var pairOpen = false;
    for (var i=0;i<info.length;i++){
      var inf = info[i];
      var tk = inf.tk;
      if (/^\s+$/.test(tk)) { out += tk; continue; }
      if (!inf.isWord) {
        // 标点的语调
        if (annotate && /[.!?]/.test(tk)) {
          var tone = sentenceTone(text);
          out += '<span class="tone ' + tone + '">' + esc(tk) + '</span>';
        } else {
          out += esc(tk);
        }
        if (/[.!?]/.test(tk)) { if (pairOpen) { out += '</span>'; pairOpen = false; } }
        continue;
      }
      // 单词渲染
      var wordHtml = renderWord(tk, inf.clean);
      if (annotate && inf.linkNext && !pairOpen) {
        out += '<span class="link-pair">' + wordHtml;
        pairOpen = true;
      } else if (annotate && inf.linkPrev && pairOpen) {
        out += wordHtml + '</span>';
        pairOpen = false;
      } else {
        if (pairOpen) { out += '</span>'; pairOpen = false; }
        out += wordHtml;
      }
    }
    if (pairOpen) out += '</span>';
    return out;
  }

  function renderWord(tk, clean){
    var html = esc(tk);
    if (!annotate) return '<span class="w" data-w="' + esc(clean) + '">' + html + '</span>';
    // 略读：n't
    var s = tk.replace(/[\u2019]/g, "'");
    if (/n't$/i.test(s)) {
      html = esc(s.slice(0, -1)) + '<span class="strike">' + esc(s.slice(-1)) + '</span>';
    }
    return '<span class="w" data-w="' + esc(clean) + '">' + html + '</span>';
  }

  // ---------- 渲染课文 ----------
  var $ = function(id){ return document.getElementById(id); };
  var showTranslation = false;
  function getTranslation(x, idx){
    var arr = x.translations || [];
    return (arr[idx] || '').trim();
  }
  function makeTranslation(text){
    var div = document.createElement('div');
    div.className = 'translation' + (text ? '' : ' empty');
    if (showTranslation) div.classList.add('show');
    div.textContent = text || '（暂无翻译）';
    return div;
  }
  function renderLesson(x){
    cur = x;
    $('lessonTitle').textContent = '📄 ' + x.mc + ' · ' + x.title;
    var isDialogue = x.content.type === 'dialogue';
    var n = isDialogue ? x.content.turns.length : x.content.paragraphs.length;
    $('lessonMeta').textContent = (isDialogue ? '对话 · ' : '短文 · ') + n + ' 段' + (isDialogue ? '（说话人）' : '（段落）');
    var box = $('content');
    box.innerHTML = '';
    if (isDialogue) {
      x.content.turns.forEach(function(t, idx){
        if (t.speaker == null) {
          var dv = document.createElement('div');
          dv.className = 'divider';
          dv.textContent = t.text || '—';
          box.appendChild(dv);
          return;
        }
        var row = document.createElement('div');
        row.className = 'turn';
        var spk = document.createElement('button');
        spk.className = 'spk'; spk.type = 'button'; spk.textContent = '🔊';
        spk.setAttribute('data-text', t.text);
        var wrap = document.createElement('div');
        wrap.className = 'bubblewrap';
        var name = document.createElement('span');
        name.className = 'speaker' + (idx % 2 ? ' alt' : '');
        name.textContent = t.speaker;
        var bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.innerHTML = renderUnit(t.text);
        wrap.appendChild(name); wrap.appendChild(bubble);
        wrap.appendChild(makeTranslation(getTranslation(x, idx)));
        row.appendChild(spk); row.appendChild(wrap);
        box.appendChild(row);
      });
    } else {
      x.content.paragraphs.forEach(function(p, idx){
        var row = document.createElement('div');
        row.className = 'unit';
        var spk = document.createElement('button');
        spk.className = 'spk'; spk.type = 'button'; spk.textContent = '🔊';
        spk.setAttribute('data-text', p);
        var body = document.createElement('div');
        body.className = 'body';
        body.innerHTML = renderUnit(p);
        body.appendChild(makeTranslation(getTranslation(x, idx)));
        row.appendChild(spk); row.appendChild(body);
        box.appendChild(row);
      });
    }
    // 图例
    if (annotate) {
      var legend = document.createElement('div');
      legend.className = 'legend';
      legend.innerHTML = '<span><i class="arc"></i> 连读 Linking</span><span><i class="strk">t</i> 略读 Unreleased</span><span><i class="arrow" style="color:#3b82f6">↘</i> 降调 <i class="arrow" style="color:#f59e0b">↗</i> 升调</span>';
      box.appendChild(legend);
    }
  }

  function selectLesson(mc, persist){
    var x = DATA.find(function(d){ return d.mc === mc; });
    if (!x) return;
    renderLesson(x);
    if (persist !== false) { try { localStorage.setItem(LSK, mc); } catch(e){} }
  }

  // ---------- 初始化 ----------
  (function init(){
    var sel = $('lesson');
    DATA.forEach(function(x){
      var o = document.createElement('option');
      o.value = x.mc;
      o.textContent = x.mc + ' · ' + x.title;
      sel.appendChild(o);
    });
    if (!DATA.length) { $('content').innerHTML = '<div class="empty">短文数据未加载，请确认 shadowing_data.js 存在</div>'; return; }
    var last = null;
    try { last = localStorage.getItem(LSK); } catch(e){}
    if (last && DATA.some(function(d){ return d.mc === last; })) sel.value = last;
    else sel.value = DATA[0].mc;
    selectLesson(sel.value, false);
  })();

  // ---------- 事件 ----------
  $('lesson').addEventListener('change', function(){ selectLesson(this.value); });
  $('btnRandom').addEventListener('click', function(){
    if (!DATA.length) return;
    var mc = DATA[Math.floor(Math.random()*DATA.length)].mc;
    $('lesson').value = mc; selectLesson(mc); toast('已随机：' + mc);
  });
  $('btnReadAll').addEventListener('click', function(){ speakAll(); });
  $('btnStop').addEventListener('click', function(){ if (synth) synth.cancel(); speaking = false; });
  $('annChk').addEventListener('change', function(){ annotate = this.checked; if (cur) renderLesson(cur); });
  $('btnTrans').addEventListener('click', function(){
    showTranslation = !showTranslation;
    this.textContent = showTranslation ? '🌐 隐藏翻译' : '🌐 显示翻译';
    this.className = showTranslation ? 'btn btn-purple' : 'btn btn-line';
    document.querySelectorAll('.translation').forEach(function(el){
      el.classList.toggle('show', showTranslation);
    });
  });
  $('rate').addEventListener('input', function(){ curRate = parseFloat(this.value); $('rateVal').textContent = curRate.toFixed(2).replace(/0$/,'') + '×'; });

  // 喇叭 / 单词点击（事件委托）
  $('content').addEventListener('click', function(e){
    var spk = e.target.closest('.spk');
    if (spk) { speakUnit(spk.getAttribute('data-text')); return; }
    var w = e.target.closest('.w');
    if (w) {
      var word = w.getAttribute('data-w');
      if (word) speakSeq([word]);
    }
  });

  function toast(msg){
    var t = $('toast'); t.textContent = msg; t.classList.add('show');
    setTimeout(function(){ t.classList.remove('show'); }, 1800);
  }
})();
</script>
</body>
